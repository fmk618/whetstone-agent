<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>磨刀石架构图</title>
<style>
  body{margin:0;background:#f6f0e3;display:flex;justify-content:center;padding:24px 0;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  svg{max-width:100%;height:auto}
</style>
</head>
<body>
<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="磨刀石架构图">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a7a63"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="480" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#3b3327">Whetstone(磨刀石)架构</text>

  <!-- 前端 -->
  <g>
    <rect x="60" y="80" width="220" height="120" rx="10" fill="#fbf7ec" stroke="#d8ccb4"/>
    <text x="170" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#3b3327">前端</text>
    <text x="170" y="130" text-anchor="middle" font-size="12" fill="#6b5f4d">React 18 + Vite + TS</text>
    <text x="170" y="150" text-anchor="middle" font-size="12" fill="#6b5f4d">资料库 / 出题 / 面试</text>
    <text x="170" y="170" text-anchor="middle" font-size="12" fill="#6b5f4d">复习 / 设置</text>
  </g>

  <!-- 后端 -->
  <g>
    <rect x="380" y="70" width="240" height="150" rx="10" fill="#fbf7ec" stroke="#a3622a" stroke-width="1.5"/>
    <text x="500" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#3b3327">后端 FastAPI</text>
    <rect x="400" y="110" width="200" height="26" rx="6" fill="#f3e7d6"/>
    <text x="500" y="127" text-anchor="middle" font-size="12" fill="#5a4a35">REST API(docs/quiz/settings)</text>
    <rect x="400" y="144" width="200" height="26" rx="6" fill="#f3e7d6"/>
    <text x="500" y="161" text-anchor="middle" font-size="12" fill="#5a4a35">入库:解析 / 敏感检测 / 切块</text>
    <rect x="400" y="178" width="200" height="26" rx="6" fill="#f3e7d6"/>
    <text x="500" y="195" text-anchor="middle" font-size="12" fill="#5a4a35">混合检索:向量 + BM25</text>
  </g>

  <!-- LLM Router(强调) -->
  <g>
    <rect x="700" y="80" width="200" height="110" rx="10" fill="#a3622a" opacity="0.12"/>
    <rect x="700" y="80" width="200" height="110" rx="10" fill="none" stroke="#a3622a" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="800" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#a3622a">LLM Router</text>
    <text x="800" y="128" text-anchor="middle" font-size="12" fill="#5a4a35">角色路由 + 隐私闸门</text>
    <text x="800" y="148" text-anchor="middle" font-size="11" fill="#6b5f4d">local_only → 409 确认</text>
    <text x="800" y="168" text-anchor="middle" font-size="11" fill="#6b5f4d">5 角色独立选模型</text>
  </g>

  <!-- 本地存储 -->
  <g>
    <rect x="380" y="290" width="240" height="130" rx="10" fill="#fbf7ec" stroke="#d8ccb4"/>
    <text x="500" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#3b3327">本地存储 data/</text>
    <text x="500" y="342" text-anchor="middle" font-size="12" fill="#6b5f4d">SQLite:题目 / 作答 / 会话 / 复习</text>
    <text x="500" y="362" text-anchor="middle" font-size="12" fill="#6b5f4d">ChromaDB:personal / reference 集合</text>
    <text x="500" y="382" text-anchor="middle" font-size="12" fill="#6b5f4d">raw/:原始文件(不入 git)</text>
  </g>

  <!-- LLM 服务商 -->
  <g>
    <rect x="700" y="290" width="200" height="130" rx="10" fill="#fbf7ec" stroke="#d8ccb4"/>
    <text x="800" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#3b3327">LLM 服务商</text>
    <text x="800" y="342" text-anchor="middle" font-size="12" fill="#6b5f4d">云端:千问 / 豆包 / Kimi</text>
    <text x="800" y="362" text-anchor="middle" font-size="12" fill="#6b5f4d">        / DeepSeek</text>
    <text x="800" y="382" text-anchor="middle" font-size="12" fill="#6b5f4d">本地:Ollama / LM Studio</text>
  </g>

  <!-- 连线 -->
  <path d="M280,140 L376,140" stroke="#8a7a63" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="328" y="132" text-anchor="middle" font-size="11" fill="#8a7a63">/api/*</text>
  <path d="M620,140 L696,140" stroke="#8a7a63" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M500,220 L500,286" stroke="#8a7a63" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M800,190 L800,286" stroke="#8a7a63" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- 底注 -->
  <text x="480" y="470" text-anchor="middle" font-size="12" fill="#8a7a63">异步可选:extract / generate / evaluate / interview / embed 五个角色可绑定不同服务商与模型</text>
  <text x="480" y="492" text-anchor="middle" font-size="12" fill="#8a7a63">隐私:含敏感信息的文档默认 local_only,发云端需用户知情确认</text>
</svg>
</body>
</html>
