<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 500" width="1200" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Whetstone（磨刀石）工作流程图</title>
  <desc id="desc">从个人资料输入、解析索引、混合检索和模型路由，到生成题目、评分与复习的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .node-title { font: 600 15px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .node-text { font: 12px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4b5563; }
      .note { font: 12px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .node-accent { fill: #ffffff; stroke: #9a5b24; stroke-width: 1.8; }
      .arrow { fill: none; stroke: #6b7280; stroke-width: 1.6; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #9ca3af; stroke-width: 1.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Whetstone（磨刀石）工作流程</text>

  <g>
    <rect x="35" y="105" width="190" height="112" rx="8" class="node"/>
    <text x="130" y="135" text-anchor="middle" class="node-title">资料输入</text>
    <text x="130" y="160" text-anchor="middle" class="node-text">简历 / 项目文档</text>
    <text x="130" y="180" text-anchor="middle" class="node-text">学习笔记 / 岗位描述</text>
    <text x="130" y="200" text-anchor="middle" class="node-text">上传到资料库</text>

    <rect x="265" y="105" width="190" height="112" rx="8" class="node"/>
    <text x="360" y="135" text-anchor="middle" class="node-title">解析与建立索引</text>
    <text x="360" y="160" text-anchor="middle" class="node-text">解析 · 敏感信息检测</text>
    <text x="360" y="180" text-anchor="middle" class="node-text">切块 · 生成向量</text>
    <text x="360" y="200" text-anchor="middle" class="node-text">标记本地或云端范围</text>

    <rect x="495" y="105" width="190" height="112" rx="8" class="node"/>
    <text x="590" y="135" text-anchor="middle" class="node-title">检索相关资料</text>
    <text x="590" y="160" text-anchor="middle" class="node-text">向量检索 + BM25</text>
    <text x="590" y="180" text-anchor="middle" class="node-text">融合排序并保留出处</text>
    <text x="590" y="200" text-anchor="middle" class="node-text">个人资料 / 参考资料</text>

    <rect x="725" y="105" width="190" height="112" rx="8" class="node-accent"/>
    <text x="820" y="135" text-anchor="middle" class="node-title">模型路由</text>
    <text x="820" y="160" text-anchor="middle" class="node-text">抽取 / 出题 / 评分</text>
    <text x="820" y="180" text-anchor="middle" class="node-text">面试 / 嵌入</text>
    <text x="820" y="200" text-anchor="middle" class="node-text">敏感资料发送前确认</text>

    <rect x="955" y="105" width="210" height="112" rx="8" class="node"/>
    <text x="1060" y="135" text-anchor="middle" class="node-title">练习闭环</text>
    <text x="1060" y="160" text-anchor="middle" class="node-text">生成题目并作答</text>
    <text x="1060" y="180" text-anchor="middle" class="node-text">评分与反馈</text>
    <text x="1060" y="200" text-anchor="middle" class="node-text">形成复习队列</text>
  </g>

  <g>
    <path d="M225 161 L257 161" class="arrow"/>
    <path d="M455 161 L487 161" class="arrow"/>
    <path d="M685 161 L717 161" class="arrow"/>
    <path d="M915 161 L947 161" class="arrow"/>
  </g>

  <g>
    <rect x="380" y="315" width="260" height="78" rx="8" class="node"/>
    <text x="510" y="344" text-anchor="middle" class="node-title">本地数据</text>
    <text x="510" y="366" text-anchor="middle" class="node-text">SQLite：练习、作答、复习记录</text>
    <text x="510" y="384" text-anchor="middle" class="node-text">ChromaDB：资料向量与出处</text>

    <rect x="760" y="315" width="260" height="78" rx="8" class="node"/>
    <text x="890" y="344" text-anchor="middle" class="node-title">模型服务</text>
    <text x="890" y="366" text-anchor="middle" class="node-text">本地 Ollama / LM Studio</text>
    <text x="890" y="384" text-anchor="middle" class="node-text">或云端 OpenAI 兼容服务</text>
  </g>

  <path d="M590 217 L510 307" class="branch"/>
  <path d="M820 217 L890 307" class="branch"/>
  <text x="600" y="445" text-anchor="middle" class="note">默认本地优先：敏感资料只在本机处理，确需使用云端模型时先征得用户确认。</text>
</svg>
