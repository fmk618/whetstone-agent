[project]
name = "whetstone-backend"
version = "0.1.0"
description = "Whetstone(磨刀石)——个人面试与学习智能体后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openai>=1.40",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
